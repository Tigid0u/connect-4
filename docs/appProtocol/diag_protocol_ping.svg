font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.7578" x="11" y="324.3955">And since there is no activity after the READY command,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2134" x="11" y="341.6865">the server will send a PING to the client.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="359.7578" x="0" y="376.5947"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="359.7578" y1="376.5947" y2="376.5947"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="359.7578" y1="379.5947" y2="379.5947"/><rect fill="#EEEEEE" height="25.291" style="stroke:#000000;stroke-width:2;" width="111.5381" x="124.1099" y="364.9492"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.9263" x="130.1099" y="382.9775">Ping the server</text><g class="message" data-participant-1="Server" data-participant-2="Client"><polygon fill="#181818" points="141.8965,419.5313,131.8965,423.5313,141.8965,427.5313,137.8965,423.5313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="135.8965" x2="226.5273" y1="423.5313" y2="423.5313"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="147.8965" y="418.2686">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.7827" x="159.1265" y="418.2686">PING</text></g><!--SRC=[RP11QyCm38Nl-XNw0LrWrq86OHkZBRHbssL7pr5MWIC5HsqfvCVFZbTMs6v6Jz_JynjSDFOyE35y34nYCDoCtYYUA88xcign_wI8zm1rZMjbmN4MiQwXa7Zty0CiSRrRRR49x0dAA8jbROcx3KpJz0_r-jmyVSnQLLKWQeIQsRAvkCPvFz3r-7wrVK6LSC7pWGGjALv5o1kh08_8RI3iDA93Jz5SoZrGP6rHEpJkgO96MXnPF6Ky4YPA55soEB5Tq7MM3cNdELxoxtidxGBiDyQPGqZlPEHA9DEIPGvUGLRoTt9tUvOll65JVtyhoYRV]--></g></svg>